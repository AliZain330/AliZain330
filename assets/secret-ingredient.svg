<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
<title id="title">There is no secret ingredient</title>
<desc id="desc">“There is no secret ingredient. To make something special, you just have to believe it’s special.” — Mr. Ping, Kung Fu Panda.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142b26"/><stop offset="1" stop-color="#243f2e"/></linearGradient></defs>
<rect x="1" y="1" width="958" height="238" rx="16" fill="url(#bg)" stroke="#b9954e"/>
<rect x="12" y="12" width="936" height="216" rx="9" fill="none" stroke="#b9954e" stroke-opacity=".35"/>
<g stroke="#e8c56d" stroke-width="2" fill="none"><path d="M28 57V28h29m846 0h29v29M28 183v29h29m846 0h29v-29"/></g>
<text x="51" y="112" font-family="Georgia,serif" font-size="115" fill="#e8c56d" opacity=".35">“</text>
<text x="850" y="211" font-family="Georgia,serif" font-size="115" fill="#e8c56d" opacity=".35">”</text>
<g text-anchor="middle" font-family="Georgia,serif">
<text x="480" y="77" font-size="34" fill="#f5d485">There is no secret ingredient.</text>
<text x="480" y="120" font-size="27" fill="#fff1d4">To make something special,</text>
<text x="480" y="156" font-size="27" fill="#fff1d4">you just have to believe it’s special.</text>
<text x="480" y="198" font-size="18" font-style="italic" fill="#d3bc86">— Mr. Ping, Kung Fu Panda</text>
</g>
</svg>
