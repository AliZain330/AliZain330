<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
<title id="title">Hello, I’m Ali Zain — The Dragon Scroll</title>
<desc id="desc">Currently studying at HKU. “There is no secret ingredient. To make something special, you just have to believe it’s special.” — Mr. Ping, Kung Fu Panda.</desc>
<style>
.reveal{transform-origin:560px 120px;animation:reveal 500ms cubic-bezier(.23,1,.32,1) both}
@keyframes reveal{from{opacity:0;transform:scaleX(.95)}to{opacity:1;transform:scaleX(1)}}
.shine{animation:shine 3s cubic-bezier(.77,0,.175,1) 2;opacity:0}
@keyframes shine{0%{transform:translateX(-400px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(400px);opacity:0}}
@media(prefers-reduced-motion:reduce){.reveal,.shine{animation:none}.shine{display:none}}
</style>
<defs>
<linearGradient id="jade" x2="1" y2="1"><stop stop-color="#0c211e"/><stop offset="1" stop-color="#254b3b"/></linearGradient>
<linearGradient id="paper" x2="0" y2="1"><stop stop-color="#eacb85"/><stop offset=".5" stop-color="#fff0ca"/><stop offset="1" stop-color="#dfb967"/></linearGradient>
<linearGradient id="gleam"><stop stop-color="#fff4cf" stop-opacity="0"/><stop offset=".5" stop-color="#b77a13"/><stop offset="1" stop-color="#fff4cf" stop-opacity="0"/></linearGradient>
<clipPath id="name"><text x="560" y="96" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="44">Hello, I’m Ali Zain.</text></clipPath>
</defs>
<rect x="1" y="1" width="958" height="238" rx="16" fill="url(#jade)" stroke="#ac893e" stroke-opacity=".55"/>
