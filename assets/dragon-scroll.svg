<g class="reveal">
<rect x="210" y="20" width="700" height="200" rx="7" fill="#e8c56d"/>
<rect x="221" y="29" width="678" height="182" rx="3" fill="url(#paper)" stroke="#b78b35"/>
<g fill="#9d692e" stroke="#e8c56d" stroke-width="2"><rect x="198" y="12" width="24" height="216" rx="12"/><rect x="898" y="12" width="24" height="216" rx="12"/></g>
<text x="560" y="47" text-anchor="middle" font-family="Georgia,serif" font-size="11" letter-spacing="4" fill="#6f713d">THE DRAGON SCROLL</text>
<text x="560" y="96" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="44" fill="#263c30">Hello, I’m Ali Zain.</text>
<g clip-path="url(#name)"><rect class="shine" x="490" y="54" width="140" height="52" fill="url(#gleam)"/></g>
<text x="560" y="128" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#4e6248">Currently studying at HKU.</text>
<path d="M510 145h100" stroke="#b78b35"/>
<g text-anchor="middle" font-family="Georgia,serif" fill="#6c5835">
<text x="560" y="168" font-size="14">“There is no secret ingredient. To make something special,</text>
<text x="560" y="187" font-size="14">you just have to believe it’s special.”</text>
<text x="560" y="204" font-size="11" font-style="italic" fill="#6c5835">— Mr. Ping, Kung Fu Panda</text>
</g>
</g>
<g transform="translate(5 4) scale(.82)">
