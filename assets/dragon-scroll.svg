<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">Hello, I’m Ali Zain — The Dragon Scroll</title>
<desc id="desc">A friendly panda beside a golden scroll introducing Ali Zain, currently studying at HKU.</desc>
<style>
.reveal{transform-origin:480px 150px;animation:reveal 500ms cubic-bezier(.23,1,.32,1) both}
@keyframes reveal{from{opacity:0;transform:scaleX(.95)}to{opacity:1;transform:scaleX(1)}}
.shine{animation:shine 3s cubic-bezier(.77,0,.175,1) 2;opacity:0}
@keyframes shine{0%{transform:translateX(-400px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(400px);opacity:0}}
@media(prefers-reduced-motion:reduce){.reveal,.shine{animation:none}.shine{display:none}}
</style>
